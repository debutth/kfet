<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDE Polytech Marseille</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>BDE</h1>
                <p>Polytech Marseille</p>
            </div>
            <ul class="nav-links">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#suggestions">Suggestions</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="accueil" class="hero">
        <div class="hero-content">
            <h2>Bienvenue au BDE</h2>
            <p>Kfet st Jérome</p>
            <p class="subtitle">Créons des souvenirs ensemble !</p>
        </div>
    </section>



    <!-- Suggestions Section -->
    <section id="suggestions" class="suggestions">
        <div class="container">
            <h2>Boîte à Suggestions</h2>
            <p class="suggestions-subtitle">Tes idées nous intéressent ! Propose tes suggestions pour améliorer le BDE 💡</p>
            
            <form class="suggestion-form">
                <div class="form-group">
                    <input type="text" id="suggestionAuthor" placeholder="Ton nom (optionnel)" maxlength="50">
                </div>
                <div class="form-group">
                    <input type="text" id="suggestionTitle" placeholder="Titre de ta suggestion" required maxlength="100">
                </div>
                <div class="form-group">
                    <textarea id="suggestionText" placeholder="Détaille ta suggestion..." rows="4" required maxlength="500"></textarea>
                </div>
                <button type="submit" class="submit-btn">Soumettre ma suggestion</button>
            </form>

            <div class="suggestions-list" id="suggestionsList">
                <!-- Les suggestions apparaîtront ici -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 BDE Polytech Marseille. Tous droits réservés.</p>
            <div class="social-links">            
                <a href="#" target="_blank">Instagram</a>                
            </div>
        </div>
    </footer>

    <!-- Firebase -->
    <script type="module" src="firebase-config.js"></script>

    <script src="script.js"></script>
</body>
</html>
